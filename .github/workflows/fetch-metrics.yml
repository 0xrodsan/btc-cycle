name: Fetch Daily Metrics

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch and commit metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Realized Price
        run: |
          curl -sf \
            "https://api.bgeometrics.com/v1/realized-price?token=${{ secrets.BGEOMETRICS_API_KEY }}" \
            -o data/realized-price.json

      - name: Fetch MVRV Z-Score
        run: |
          curl -sf \
            "https://api.bgeometrics.com/v1/mvrv-zscore?token=${{ secrets.BGEOMETRICS_API_KEY }}" \
            -o data/mvrv-zscore.json

      - name: Fetch BTC Spot Price (CoinGecko)
        run: |
          PRICE_DATA=$(curl -s "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
          FETCHED_AT=$(date -u +"%Y-%m-%d")
          echo "$PRICE_DATA" | jq --arg date "$FETCHED_AT" '. + {fetched_at: $date}' > data/btc-price.json

      - name: Fetch LTH Net Position Change 30d
        run: |
          curl -s "https://api.bgeometrics.com/v1/lth-net-position-change-30d-btc?token=${{ secrets.BGEOMETRICS_API_KEY }}" \
            > data/lth-position-change.json
          echo "LTH position change fetched"

      - name: Fetch Illiquid Supply
        run: |
          NEW=$(curl -s "https://api.bgeometrics.com/v1/illiquid-supply?token=${{ secrets.BGEOMETRICS_API_KEY }}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d[-1])) if isinstance(d,list) and d else None' 2>/dev/null)
          if [ -n "$NEW" ] && [ -f "data/illiquid-supply.json" ]; then
            python3 -c 'import json,sys; n=json.loads(sys.argv[1]); e=json.load(open(sys.argv[2])); e=(e if e and e[-1][0]==n[0] else e+[n])[-60:]; print(json.dumps(e,indent=2))' "$NEW" "data/illiquid-supply.json" > data/illiquid-supply.tmp && mv data/illiquid-supply.tmp data/illiquid-supply.json
          else
            curl -s "https://api.bgeometrics.com/v1/illiquid-supply?token=${{ secrets.BGEOMETRICS_API_KEY }}" > data/illiquid-supply.json
          fi
          echo "Illiquid supply updated"

      - name: Fetch Puell Multiple
        run: |
          curl -s "https://api.bgeometrics.com/v1/puell-multiple?token=${{ secrets.BGEOMETRICS_API_KEY }}" \
            > data/puell-multiple.json
          echo "Puell multiple fetched"

      - name: Fetch Whale Balance
        run: |
          NEW=$(curl -s "https://api.bgeometrics.com/v1/balance-addr-10K-BTC?token=${{ secrets.BGEOMETRICS_API_KEY }}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d[-1])) if isinstance(d,list) and d else None' 2>/dev/null)
          if [ -n "$NEW" ] && [ -f "data/whale-balance.json" ]; then
            python3 -c 'import json,sys; n=json.loads(sys.argv[1]); e=json.load(open(sys.argv[2])); e=(e if e and e[-1][0]==n[0] else e+[n])[-60:]; print(json.dumps(e,indent=2))' "$NEW" "data/whale-balance.json" > data/whale-balance.tmp && mv data/whale-balance.tmp data/whale-balance.json
          else
            curl -s "https://api.bgeometrics.com/v1/balance-addr-10K-BTC?token=${{ secrets.BGEOMETRICS_API_KEY }}" > data/whale-balance.json
          fi
          echo "Whale balance updated"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realized-price.json data/mvrv-zscore.json data/btc-price.json data/lth-position-change.json data/illiquid-supply.json data/puell-multiple.json data/whale-balance.json
          if git diff --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "data: daily metrics update [skip ci]"
            git push
          fi
