<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Cycle | Blackbox</title>
  <meta name="description" content="On-chain signals for long-term Bitcoin holders — realized price, MVRV Z-Score, and cycle zone analysis.">

  <link rel="alternate" hreflang="en" href="https://0xrodsan.github.io/btc-cycle/">
  <link rel="alternate" hreflang="x-default" href="https://0xrodsan.github.io/btc-cycle/">
  <link rel="canonical" href="https://0xrodsan.github.io/btc-cycle/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>

  <script src="config.js"></script>
</head>
<body>

  <!-- ============================================================
       Header
       ============================================================ -->
  <header class="site-header">
    <div class="header-inner">
      <a href="https://0xrodsan.github.io/" class="site-logo">RodSan</a>

      <nav class="site-nav" aria-label="Main navigation">
        <ul class="nav-list">
          <li class="nav-item"><a href="https://0xrodsan.github.io/blackbox/" class="nav-link">Blackbox</a></li>
          <li class="nav-item"><a href="https://0xrodsan.github.io/contato.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a href="./pt/" class="lang-flag" aria-label="Português — coming soon" title="Português — coming soon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="24" height="16" aria-hidden="true">
            <rect width="30" height="20" fill="#009c3b"/>
            <polygon points="15,2.5 27,10 15,17.5 3,10" fill="#ffdf00"/>
            <circle cx="15" cy="10" r="4.5" fill="#002776"/>
          </svg>
        </a>

        <button type="button" class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation" hidden>
      <ul class="mobile-nav-list">
        <li class="mobile-nav-item"><a href="https://0xrodsan.github.io/blackbox/" class="mobile-nav-link">Blackbox</a></li>
        <li class="mobile-nav-item"><a href="https://0xrodsan.github.io/contato.html" class="mobile-nav-link">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ============================================================
       Main
       ============================================================ -->
  <main class="main-content">

    <!-- Hero -->
    <section class="hero reveal" aria-labelledby="hero-title">
      <h1 id="hero-title" class="hero-title">BTC Cycle</h1>
      <p class="hero-subtitle">On-chain signals for long-term holders.</p>
    </section>

    <!-- Metrics -->
    <section class="metrics-section" aria-label="On-chain metrics">

      <!-- Error state — hidden until JS triggers it -->
      <p id="data-error" class="data-error" role="alert" hidden></p>

      <!-- Block 1 — Realized Price -->
      <div class="metric-block reveal" aria-labelledby="rp-label">
        <p class="metric-label" id="rp-label">
          <a class="metric-title-link" href="https://www.bitcoinmagazinepro.com/charts/realized-price/" target="_blank" rel="noopener">Realized Price</a>
        </p>

        <div class="metric-value-row">
          <span class="metric-value" id="rp-value" aria-label="Realized Price" tabindex="0">—</span>
          <span class="metric-spot-label">
            BTC <span id="btc-price-display" tabindex="0">—</span>
          </span>
        </div>

        <p class="metric-premium" id="rp-premium" aria-label="Premium or discount vs realized price" tabindex="0">—</p>

        <div class="metric-zone-row">
          <span class="zone-badge zone-badge--neutral" id="rp-zone-badge" tabindex="0">—</span>
        </div>

        <p class="metric-interpretation" id="rp-interpretation"></p>
      </div>

      <!-- Block 2 — MVRV Z-Score -->
      <div class="metric-block reveal" aria-labelledby="mvrv-label">
        <p class="metric-label" id="mvrv-label">
          <a class="metric-title-link" href="https://www.bitcoinmagazinepro.com/charts/mvrv-zscore/" target="_blank" rel="noopener">MVRV Z-Score</a>
        </p>

        <div class="metric-value-row">
          <span class="metric-value" id="mvrv-value" aria-label="MVRV Z-Score" tabindex="0">—</span>
        </div>

        <div class="metric-zone-row">
          <span class="zone-badge zone-badge--neutral" id="mvrv-zone-badge" tabindex="0">—</span>
        </div>

        <p class="metric-interpretation" id="mvrv-interpretation"></p>
      </div>

      <!-- Data freshness -->
      <div class="data-freshness" aria-label="Data freshness">
        Updated daily &middot; Last update: <span id="last-update">—</span>
      </div>

    </section>

  </main>

  <!-- ============================================================
       Footer
       ============================================================ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">© <span class="footer-year">2025</span> RodSan</p>
      <ul class="footer-social">
        <li>
          <a href="https://x.com/0xRodSan" class="footer-social-link" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </footer>

  <script src="tooltips.js"></script>
  <script src="main.js" defer></script>
</body>
</html>
